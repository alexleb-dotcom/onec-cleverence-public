name: Shareable core validation

'on':
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
  workflow_dispatch: null

permissions:
  contents: read

concurrency:
  group: shareable-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  public-fast:
    name: Public Fast
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install DOCX test dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input python-docx==1.2.0
      - name: Resolve exact shareable root
        shell: bash
        run: |
          set -euo pipefail
          if test -f DISTRIBUTION_MANIFEST.json; then
            echo "VALIDATION_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          else
            snapshot_root="$(mktemp -d)"
            python TOOLS/build_distribution_snapshot.py --output "$snapshot_root/shareable.zip"
            mkdir "$snapshot_root/extracted"
            unzip -q "$snapshot_root/shareable.zip" -d "$snapshot_root/extracted"
            echo "VALIDATION_ROOT=$snapshot_root/extracted/onec-cleverence" >> "$GITHUB_ENV"
          fi
      - name: Validate exact snapshot before execution
        shell: bash
        run: |
          set -euo pipefail
          cd "$VALIDATION_ROOT"
          python TOOLS/validate_distribution_snapshot.py --root .
      - name: Run public Fast
        shell: bash
        run: |
          set -euo pipefail
          cd "$VALIDATION_ROOT"
          python TOOLS/run_public_ci.py --mode FAST | tee "$RUNNER_TEMP/public-fast-report.json"
      - name: Build and validate public Fast receipt
        shell: bash
        run: |
          set -euo pipefail
          python "$VALIDATION_ROOT/TOOLS/public_execution_receipt.py" build \
            --checkout-root "$GITHUB_WORKSPACE" \
            --validation-root "$VALIDATION_ROOT" \
            --run-report "$RUNNER_TEMP/public-fast-report.json" \
            --mode FAST \
            --output "$RUNNER_TEMP/public-fast-receipt.json"
          python "$VALIDATION_ROOT/TOOLS/public_execution_receipt.py" validate \
            --checkout-root "$GITHUB_WORKSPACE" \
            --validation-root "$VALIDATION_ROOT" \
            --run-report "$RUNNER_TEMP/public-fast-report.json" \
            --mode FAST \
            --receipt "$RUNNER_TEMP/public-fast-receipt.json"
          cat "$RUNNER_TEMP/public-fast-receipt.json"

  public-ui:
    name: Public UI
    needs: public-fast
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Resolve exact shareable root
        shell: bash
        run: |
          set -euo pipefail
          if test -f DISTRIBUTION_MANIFEST.json; then
            echo "VALIDATION_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          else
            snapshot_root="$(mktemp -d)"
            python TOOLS/build_distribution_snapshot.py --output "$snapshot_root/shareable.zip"
            mkdir "$snapshot_root/extracted"
            unzip -q "$snapshot_root/shareable.zip" -d "$snapshot_root/extracted"
            echo "VALIDATION_ROOT=$snapshot_root/extracted/onec-cleverence" >> "$GITHUB_ENV"
          fi
      - name: Validate exact snapshot before UI gate
        shell: bash
        run: |
          set -euo pipefail
          cd "$VALIDATION_ROOT"
          python TOOLS/validate_distribution_snapshot.py --root .
      - name: Run public UI contract
        shell: bash
        run: |
          set -euo pipefail
          cd "$VALIDATION_ROOT"
          python TESTS/run_control_center_ui_static_regression.py

  public-windows:
    name: Public Windows
    needs: public-fast
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate exact snapshot before Windows gate
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python TOOLS\validate_distribution_snapshot.py --root .
      - name: Set up selected artifact test Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26.7.0'
      - name: Verify zero-project archive bootstrap and rejection guards
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File PRODUCT\OneCChatWorker\tests\run_orbit_install_journal_regression.ps1
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File PRODUCT\OneCChatWorker\tests\run_orbit_bootstrap_regression.ps1
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
      - name: Build exact-head offline Windows installer
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File PRODUCT\OneCChatWorker\installer\Build-Installer.ps1 -OutputRoot "$env:RUNNER_TEMP\orbit-package"
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
      - name: Disposable native install bootstrap reopen and retain-data uninstall
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File PRODUCT\OneCChatWorker\tests\run_orbit_installer_smoke.ps1 -BuildRoot "$env:RUNNER_TEMP\orbit-package" -EvidenceRoot "$env:RUNNER_TEMP\orbit-evidence"
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
      - name: Preserve installer and exact-head installation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: orbit-slice-a-windows
          path: |
            ${{ runner.temp }}/orbit-package/OneCOrbit-Setup.exe
            ${{ runner.temp }}/orbit-package/build-receipt.json
            ${{ runner.temp }}/orbit-evidence
          if-no-files-found: warn
          retention-days: 14
      - name: Run isolated selected catalog update regression
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          powershell.exe -NoProfile -File PRODUCT\OneCChatWorker\tests\run_selected_catalog_update_regression.ps1
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
      - name: Verify real Windows Source ACL sealing with unprivileged accounts
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File PRODUCT\OneCChatWorker\tests\run_selected_source_acl_seal_regression.ps1
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
      - name: Run isolated selected first-time extension ADD regression
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File PRODUCT\OneCChatWorker\tests\run_selected_extension_add_regression.ps1
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
      - name: Run isolated existing-extension quick-sync regression
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File PRODUCT\OneCChatWorker\tests\run_extension_quicksync_regression.ps1
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
      - name: Run isolated Node launch path regression
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          powershell.exe -NoProfile -File PRODUCT\OneCChatWorker\tests\run_node_launch_path_regression.ps1
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
      - name: Run isolated persistence and admission recovery guards
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          node PRODUCT\OneCChatWorker\tests\helper-persistence-regression.mjs
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          powershell.exe -NoProfile -File PRODUCT\OneCChatWorker\tests\run_admission_recovery_guard_regression.ps1
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
      - name: Validate .NET 10 and build WPF
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $version=(& dotnet --version).Trim()
          if(-not $version.StartsWith('10.')){throw ("DOTNET_10_REQUIRED:"+$version)}
          dotnet restore PRODUCT\OneCChatWorker\control-center\OneCArchitecture.ControlCenter\OneCArchitecture.ControlCenter.csproj
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          dotnet build PRODUCT\OneCChatWorker\control-center\OneCArchitecture.ControlCenter\OneCArchitecture.ControlCenter.csproj -c Release --no-restore
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
      - name: Run PS5.1 bounded UI context regression
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File PRODUCT\OneCChatWorker\tests\run_ui_context_regression.ps1
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
      - name: Run isolated Orbit migration read-only preflight regression
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File PRODUCT\OneCChatWorker\tests\run_orbit_migration_readonly_preflight_regression.ps1
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
      - name: Run isolated updater image-in-use and tray-hidden fixture
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python PRODUCT\OneCChatWorker\tests\run_orbit_update_image_lease_regression.py
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
      - name: Verify trusted read-only release discovery decisions
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python PRODUCT\OneCChatWorker\tests\run_orbit_readonly_discovery_regression.py
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
      - name: Verify S2-L1B signed release authority offline fixtures
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $env:PYTHONDONTWRITEBYTECODE='1'
          python PRODUCT\OneCChatWorker\tests\run_orbit_release_authority_regression.py
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
      - name: Verify S2-L1B immutable Git tree and signed provenance
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $env:PYTHONDONTWRITEBYTECODE='1'
          python PRODUCT\OneCChatWorker\tests\run_orbit_git_tree_regression.py
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
      - name: Run isolated real WPF usability fixtures
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          powershell.exe -NoProfile -File PRODUCT\OneCChatWorker\tests\run_control_center_wpf_fixture.ps1 -ArtifactsRoot "$env:RUNNER_TEMP\ux5-evidence"
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
      - name: Preserve exact-head WPF fixture screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: control-center-ux5-fixtures
          path: ${{ runner.temp }}/ux5-evidence/screenshots
          if-no-files-found: error
          retention-days: 14
      - name: Import Core and verify zero-copy typed surface
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $core='PRODUCT\OneCChatWorker\core\OneCChatWorker.Core.psm1'
          $text=Get-Content -LiteralPath $core -Raw -Encoding UTF8
          if($text -match '(?i)\$pid\s*='){throw 'READONLY_PID_ASSIGNMENT_PRESENT'}
          Import-Module (Resolve-Path $core) -Force -DisableNameChecking
          foreach($name in @('Prepare-SourceUpdate','Accept-SourceUpdate','Cancel-SourceUpdate','Recover-SourceUpdatePromotion')){
            if(-not(Get-Command $name -ErrorAction SilentlyContinue)){throw ('SOURCE_UPDATE_COMMAND_MISSING:'+$name)}
          }

  public-full-validation:
    name: Public Full Validation
    # Heavy independent FULL checks begin alongside UI/Windows after Fast.
    # The REQUIRED "Public Full" context remains a final all-gates aggregate.
    needs: public-fast
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up native transport test Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26.7.0'
      - name: Install native transport test ripgrep
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ripgrep
          fi
          node --version
          npm --version
          rg --version
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install DOCX test dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input python-docx==1.2.0
      - name: Resolve exact shareable root
        shell: bash
        run: |
          set -euo pipefail
          if test -f DISTRIBUTION_MANIFEST.json; then
            echo "VALIDATION_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          else
            snapshot_root="$(mktemp -d)"
            python TOOLS/build_distribution_snapshot.py --output "$snapshot_root/shareable.zip"
            mkdir "$snapshot_root/extracted"
            unzip -q "$snapshot_root/shareable.zip" -d "$snapshot_root/extracted"
            echo "VALIDATION_ROOT=$snapshot_root/extracted/onec-cleverence" >> "$GITHUB_ENV"
          fi
      - name: Validate exact snapshot before execution
        shell: bash
        run: |
          set -euo pipefail
          cd "$VALIDATION_ROOT"
          python TOOLS/validate_distribution_snapshot.py --root .
      - name: Run public Full
        shell: bash
        run: |
          set -euo pipefail
          cd "$VALIDATION_ROOT"
          python TOOLS/run_public_ci.py --mode FULL | tee "$RUNNER_TEMP/public-full-report.json"
      - name: Build and validate public Full receipt
        shell: bash
        run: |
          set -euo pipefail
          python "$VALIDATION_ROOT/TOOLS/public_execution_receipt.py" build \
            --checkout-root "$GITHUB_WORKSPACE" \
            --validation-root "$VALIDATION_ROOT" \
            --run-report "$RUNNER_TEMP/public-full-report.json" \
            --mode FULL \
            --output "$RUNNER_TEMP/public-full-receipt.json"
          python "$VALIDATION_ROOT/TOOLS/public_execution_receipt.py" validate \
            --checkout-root "$GITHUB_WORKSPACE" \
            --validation-root "$VALIDATION_ROOT" \
            --run-report "$RUNNER_TEMP/public-full-report.json" \
            --mode FULL \
            --receipt "$RUNNER_TEMP/public-full-receipt.json"
          cat "$RUNNER_TEMP/public-full-receipt.json"

  public-full:
    name: Public Full
    # The active protect-main ruleset requires Public Fast + Public Full.
    # Do not allow a passing independent FULL runner to mask Windows/UI failure.
    needs: [public-fast, public-ui, public-windows, public-full-validation]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Require all independent gates to pass
        shell: bash
        env:
          FAST_RESULT: ${{ needs.public-fast.result }}
          UI_RESULT: ${{ needs.public-ui.result }}
          WINDOWS_RESULT: ${{ needs.public-windows.result }}
          FULL_RESULT: ${{ needs.public-full-validation.result }}
        run: |
          set -euo pipefail
          for result in "$FAST_RESULT" "$UI_RESULT" "$WINDOWS_RESULT" "$FULL_RESULT"; do
            test "$result" = success || { echo "REQUIRED_GATE_NOT_SUCCESS:$result"; exit 1; }
          done
