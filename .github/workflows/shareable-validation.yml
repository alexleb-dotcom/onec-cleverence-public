name: Shareable core validation

'on':
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
  workflow_dispatch: null

permissions:
  contents: read

concurrency:
  group: shareable-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  public-fast:
    name: Public Fast
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install DOCX test dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input python-docx==1.2.0
      - name: Resolve exact shareable root
        shell: bash
        run: |
          set -euo pipefail
          if test -f DISTRIBUTION_MANIFEST.json; then
            echo "VALIDATION_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          else
            snapshot_root="$(mktemp -d)"
            python TOOLS/build_distribution_snapshot.py --output "$snapshot_root/shareable.zip"
            mkdir "$snapshot_root/extracted"
            unzip -q "$snapshot_root/shareable.zip" -d "$snapshot_root/extracted"
            echo "VALIDATION_ROOT=$snapshot_root/extracted/onec-cleverence" >> "$GITHUB_ENV"
          fi
      - name: Validate exact snapshot before execution
        shell: bash
        run: |
          set -euo pipefail
          cd "$VALIDATION_ROOT"
          python TOOLS/validate_distribution_snapshot.py --root .
      - name: Run public Fast
        shell: bash
        run: |
          set -euo pipefail
          cd "$VALIDATION_ROOT"
          python TOOLS/run_public_ci.py --mode FAST | tee "$RUNNER_TEMP/public-fast-report.json"
      - name: Build and validate public Fast receipt
        shell: bash
        run: |
          set -euo pipefail
          python "$VALIDATION_ROOT/TOOLS/public_execution_receipt.py" build \
            --checkout-root "$GITHUB_WORKSPACE" \
            --validation-root "$VALIDATION_ROOT" \
            --run-report "$RUNNER_TEMP/public-fast-report.json" \
            --mode FAST \
            --output "$RUNNER_TEMP/public-fast-receipt.json"
          python "$VALIDATION_ROOT/TOOLS/public_execution_receipt.py" validate \
            --checkout-root "$GITHUB_WORKSPACE" \
            --validation-root "$VALIDATION_ROOT" \
            --run-report "$RUNNER_TEMP/public-fast-report.json" \
            --mode FAST \
            --receipt "$RUNNER_TEMP/public-fast-receipt.json"
          cat "$RUNNER_TEMP/public-fast-receipt.json"

  public-ui:
    name: Public UI
    needs: public-fast
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Resolve exact shareable root
        shell: bash
        run: |
          set -euo pipefail
          if test -f DISTRIBUTION_MANIFEST.json; then
            echo "VALIDATION_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          else
            snapshot_root="$(mktemp -d)"
            python TOOLS/build_distribution_snapshot.py --output "$snapshot_root/shareable.zip"
            mkdir "$snapshot_root/extracted"
            unzip -q "$snapshot_root/shareable.zip" -d "$snapshot_root/extracted"
            echo "VALIDATION_ROOT=$snapshot_root/extracted/onec-cleverence" >> "$GITHUB_ENV"
          fi
      - name: Validate exact snapshot before UI gate
        shell: bash
        run: |
          set -euo pipefail
          cd "$VALIDATION_ROOT"
          python TOOLS/validate_distribution_snapshot.py --root .
      - name: Run public UI contract
        shell: bash
        run: |
          set -euo pipefail
          cd "$VALIDATION_ROOT"
          python TESTS/run_control_center_ui_static_regression.py

  public-windows:
    name: Public Windows
    needs: public-fast
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate exact snapshot before Windows gate
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python TOOLS\validate_distribution_snapshot.py --root .
      - name: Validate .NET 10 and build WPF
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $version=(& dotnet --version).Trim()
          if(-not $version.StartsWith('10.')){throw ("DOTNET_10_REQUIRED:"+$version)}
          dotnet restore PRODUCT\OneCChatWorker\control-center\OneCArchitecture.ControlCenter\OneCArchitecture.ControlCenter.csproj
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          dotnet build PRODUCT\OneCChatWorker\control-center\OneCArchitecture.ControlCenter\OneCArchitecture.ControlCenter.csproj -c Release --no-restore
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
      - name: Run PS5.1 bounded UI context regression
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File PRODUCT\OneCChatWorker\tests\run_ui_context_regression.ps1
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
      - name: Import Core and verify zero-copy typed surface
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $core='PRODUCT\OneCChatWorker\core\OneCChatWorker.Core.psm1'
          $text=Get-Content -LiteralPath $core -Raw -Encoding UTF8
          if($text -match '(?i)\$pid\s*='){throw 'READONLY_PID_ASSIGNMENT_PRESENT'}
          Import-Module (Resolve-Path $core) -Force -DisableNameChecking
          foreach($name in @('Prepare-SourceUpdate','Accept-SourceUpdate','Cancel-SourceUpdate','Recover-SourceUpdatePromotion')){
            if(-not(Get-Command $name -ErrorAction SilentlyContinue)){throw ('SOURCE_UPDATE_COMMAND_MISSING:'+$name)}
          }

  public-full:
    name: Public Full
    needs: [public-fast, public-ui, public-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install DOCX test dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input python-docx==1.2.0
      - name: Resolve exact shareable root
        shell: bash
        run: |
          set -euo pipefail
          if test -f DISTRIBUTION_MANIFEST.json; then
            echo "VALIDATION_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          else
            snapshot_root="$(mktemp -d)"
            python TOOLS/build_distribution_snapshot.py --output "$snapshot_root/shareable.zip"
            mkdir "$snapshot_root/extracted"
            unzip -q "$snapshot_root/shareable.zip" -d "$snapshot_root/extracted"
            echo "VALIDATION_ROOT=$snapshot_root/extracted/onec-cleverence" >> "$GITHUB_ENV"
          fi
      - name: Validate exact snapshot before execution
        shell: bash
        run: |
          set -euo pipefail
          cd "$VALIDATION_ROOT"
          python TOOLS/validate_distribution_snapshot.py --root .
      - name: Run public Full
        shell: bash
        run: |
          set -euo pipefail
          cd "$VALIDATION_ROOT"
          python TOOLS/run_public_ci.py --mode FULL | tee "$RUNNER_TEMP/public-full-report.json"
      - name: Build and validate public Full receipt
        shell: bash
        run: |
          set -euo pipefail
          python "$VALIDATION_ROOT/TOOLS/public_execution_receipt.py" build \
            --checkout-root "$GITHUB_WORKSPACE" \
            --validation-root "$VALIDATION_ROOT" \
            --run-report "$RUNNER_TEMP/public-full-report.json" \
            --mode FULL \
            --output "$RUNNER_TEMP/public-full-receipt.json"
          python "$VALIDATION_ROOT/TOOLS/public_execution_receipt.py" validate \
            --checkout-root "$GITHUB_WORKSPACE" \
            --validation-root "$VALIDATION_ROOT" \
            --run-report "$RUNNER_TEMP/public-full-report.json" \
            --mode FULL \
            --receipt "$RUNNER_TEMP/public-full-receipt.json"
          cat "$RUNNER_TEMP/public-full-receipt.json"
